[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-historic-launch"
version = "0.1.0"
description = "Historic and OS-specific debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-historic-launch = "dappy_historic_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_historic_launch*"]
