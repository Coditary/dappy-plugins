id: beam-observer
name: BEAM observer / dbg
version: 0.1.0
description: Erlang/Elixir observer and dbg process debugger
languages: []
launchTypes:
- beam-observer
fileExtensions:
- erl
- ex
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-niche-language-launch
  - beam-observer
initialize:
  adapterID: beam-observer
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
