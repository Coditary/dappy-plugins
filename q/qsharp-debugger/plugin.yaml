id: qsharp-debugger
name: Q# Debugger
version: 0.1.0
description: Microsoft Quantum qubit and gate debugger
languages: []
launchTypes:
- qsharp-debugger
fileExtensions:
- qs
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - qsharp-debugger
initialize:
  adapterID: qsharp-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
