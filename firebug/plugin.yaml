id: firebug
name: Firebug (legacy)
version: 0.1.0
description: Historic Firefox extension debugger (deprecated — use firefox-devtools)
languages:
- javascript
launchTypes:
- firebug
fileExtensions:
- js
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-legacy-web-dap
  - firebug
initialize:
  adapterID: firebug
launch:
  request: launch
  fields:
    program: ${program.abs}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
