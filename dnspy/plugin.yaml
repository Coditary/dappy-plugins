id: dnspy
name: dnSpy / dnSpyEx
version: 0.1.0
description: Open-source .NET debugger and assembly editor (Windows)
languages:
- csharp
launchTypes:
- dnspy
fileExtensions:
- exe
- dll
- cs
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-dnspy-launch
initialize:
  adapterID: dnspy
launch:
  request: launch
  fields:
    program: ${program.abs}
    dnspy: ${env:DNSPY}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
