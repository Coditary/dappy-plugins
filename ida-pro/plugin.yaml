id: ida-pro
name: IDA Pro
version: 0.1.0
description: Interactive Disassembler industry standard
languages: []
launchTypes:
- ida-pro
fileExtensions:
- exe
- dll
- bin
- elf
- o
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-re-launch
  - ida-pro
initialize:
  adapterID: ida-pro
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
