id: xpediter-bmc
name: Xpediter (BMC)
version: 0.1.0
description: Interactive mainframe debugger for CICS, DB2, batch
languages: []
launchTypes:
- xpediter-bmc
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-mainframe-launch
  - xpediter-bmc
initialize:
  adapterID: xpediter-bmc
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
