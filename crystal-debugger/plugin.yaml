id: crystal-debugger
name: Crystal Debugger
version: 0.1.0
description: Crystal native debug via crystal run --debug or LLDB
languages: []
launchTypes:
- crystal-debugger
fileExtensions:
- cr
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - crystal-debugger
initialize:
  adapterID: crystal-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
