id: softice
name: SoftICE
version: 0.1.0
description: Historic Windows NT/9x kernel-mode debugger
languages: []
launchTypes:
- softice
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-historic-launch
  - softice
initialize:
  adapterID: softice
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
