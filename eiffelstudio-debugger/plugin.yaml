id: eiffelstudio-debugger
name: EiffelStudio Debugger
version: 0.1.0
description: Contract-based visual Eiffel debugger
languages: []
launchTypes:
- eiffelstudio-debugger
fileExtensions:
- e
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - eiffelstudio-debugger
initialize:
  adapterID: eiffelstudio-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
