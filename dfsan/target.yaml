id: dfsan
name: DataFlowSanitizer
version: 0.1.0
description: Customizable data-flow tracking in Clang
targetTypes:
  - dfsan
  - analysis
  - sanitizer

spawn:
  command: dappy-sanitizer-run
  args:
    - dfsan
    - "${program.abs}"

connect:
  host: 127.0.0.1
  port: 0

attach:
  program: "${program.abs}"

