id: typescript-tsc
name: TypeScript Compiler
version: 0.1.0
description: Static type checking as pre-debug analysis (tsc)
languages: []
launchTypes:
- typescript-tsc
fileExtensions:
- ts
- tsx
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-extra-launch
  - typescript-tsc
initialize:
  adapterID: typescript-tsc
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
