[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-chrome-cdp"
version = "0.1.0"
description = "Chrome CDP attach launcher for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-chrome-cdp = "dappy_chrome_cdp.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_chrome_cdp*"]
