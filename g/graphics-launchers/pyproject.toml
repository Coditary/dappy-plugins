[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-graphics-launch"
version = "0.1.0"
description = "GPU, shader, and game-engine debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-graphics-launch = "dappy_graphics_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_graphics_launch*"]
