id: groovy-debugger
name: Groovy Debugger
version: 0.1.0
description: Groovy on JVM via JVMTI/jdb
languages: []
launchTypes:
- groovy-debugger
fileExtensions:
- groovy
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - groovy-debugger
initialize:
  adapterID: groovy-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
