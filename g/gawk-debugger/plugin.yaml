id: gawk-debugger
name: gawk debugger
version: 0.1.0
description: GNU Awk integrated CLI debugger
languages: []
launchTypes:
- gawk-debugger
fileExtensions:
- awk
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - gawk-debugger
initialize:
  adapterID: gawk-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
