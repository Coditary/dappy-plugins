id: openvera-uvm
name: OpenVera / UVM
version: 0.1.0
description: Microchip design verification debugger
languages: []
launchTypes:
- openvera-uvm
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-hardware-launch
  - openvera-uvm
initialize:
  adapterID: openvera-uvm
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
