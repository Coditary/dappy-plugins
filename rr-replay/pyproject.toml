[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-rr-dap"
version = "0.1.0"
description = "DAP launcher for rr replay + lldb-dap"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-rr-dap = "dappy_rr_dap.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_rr_dap*"]
