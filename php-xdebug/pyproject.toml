[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-xdebug-dap"
version = "0.1.0"
description = "Xdebug launcher for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-xdebug-dap = "dappy_xdebug_dap.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_xdebug_dap*"]
