id: powershell-debugger
name: PowerShell Debugger
version: 0.1.0
description: Set-PSBreakpoint and host-process debugging
languages: []
launchTypes:
- powershell-debugger
fileExtensions:
- ps1
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - powershell-debugger
initialize:
  adapterID: powershell-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
