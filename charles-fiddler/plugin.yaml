id: charles-fiddler
name: Charles / Fiddler
version: 0.1.0
description: HTTP/HTTPS debugging proxy
languages: []
launchTypes:
- charles-fiddler
fileExtensions:
- json
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-mobile-launch
  - charles-fiddler
initialize:
  adapterID: charles-fiddler
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
