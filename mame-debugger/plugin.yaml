id: mame-debugger
name: MAME debugger
version: 0.1.0
description: Arcade emulator CPU/memory debugger
languages: []
launchTypes:
- mame-debugger
fileExtensions:
- zip
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-hardware-launch
  - mame-debugger
initialize:
  adapterID: mame-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
