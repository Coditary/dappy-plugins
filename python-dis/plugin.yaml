id: python-dis
name: CPython dis
version: 0.1.0
description: Bytecode disassembler for Python inspection
languages: []
launchTypes:
- python-dis
fileExtensions:
- py
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-bytecode-launch
  - python-dis
initialize:
  adapterID: python-dis
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
