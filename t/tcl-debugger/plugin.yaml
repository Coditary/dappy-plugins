id: tcl-debugger
name: Tcl debugger
version: 0.1.0
description: Tcl native debug commands and tclpro
languages: []
launchTypes:
- tcl-debugger
fileExtensions:
- tcl
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - tcl-debugger
initialize:
  adapterID: tcl-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
