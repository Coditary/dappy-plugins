[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-timetravel-launch"
version = "0.1.0"
description = "Time-travel and record/replay debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-timetravel-launch = "dappy_timetravel_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_timetravel_launch*"]
