id: totalview
name: TotalView
version: 0.1.0
description: Massively parallel multi-process debugger
languages: []
launchTypes:
- totalview
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-hpc-launch
  - totalview
initialize:
  adapterID: totalview
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
