id: tcpdump
name: tcpdump
version: 0.1.0
description: Classic CLI network packet capture
languages: []
launchTypes:
- tcpdump
fileExtensions:
- pcap
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-network-launch
  - tcpdump
initialize:
  adapterID: tcpdump
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
