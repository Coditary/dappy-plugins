id: new-relic-apm
name: New Relic APM
version: 0.1.0
description: Performance and error debugging in cloud environments
languages: []
launchTypes:
- new-relic-apm
fileExtensions:
- json
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-observability-launch
  - new-relic-apm
initialize:
  adapterID: new-relic-apm
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
