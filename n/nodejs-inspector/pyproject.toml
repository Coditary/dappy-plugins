[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-node-dap"
version = "0.1.0"
description = "Node.js js-debug launcher for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-node-dap = "dappy_node_dap.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_node_dap*"]
