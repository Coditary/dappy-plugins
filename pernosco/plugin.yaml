id: pernosco
name: Pernosco
version: 0.1.0
description: Collaborative web UI for rr time-travel traces
languages: []
launchTypes:
- pernosco
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-timetravel-launch
  - pernosco
initialize:
  adapterID: pernosco
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
