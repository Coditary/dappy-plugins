[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-observability-launch"
version = "0.1.0"
description = "Cloud observability and non-breaking live-debug launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-observability-launch = "dappy_observability_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_observability_launch*"]
