id: ollydbg
name: OllyDbg
version: 0.1.0
description: Classic 32-bit Windows assembly debugger
languages: []
launchTypes:
- ollydbg
fileExtensions:
- exe
- dll
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-re-launch
  - ollydbg
initialize:
  adapterID: ollydbg
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
