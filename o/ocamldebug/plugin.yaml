id: ocamldebug
name: ocamldebug
version: 0.1.0
description: Official OCaml bytecode source debugger
languages: []
launchTypes:
- ocamldebug
fileExtensions:
- ml
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - ocamldebug
initialize:
  adapterID: ocamldebug
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
