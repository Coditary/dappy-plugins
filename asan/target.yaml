id: asan
name: AddressSanitizer
version: 0.1.0
description: Compiler ASan memory error detection
targetTypes:
  - asan
  - analysis
  - sanitizer

spawn:
  command: dappy-sanitizer-run
  args:
    - asan
    - "${program.abs}"

connect:
  host: 127.0.0.1
  port: 0

attach:
  program: "${program.abs}"

