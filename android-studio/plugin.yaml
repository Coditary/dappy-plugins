id: android-studio
name: Android Studio Profiler
version: 0.1.0
description: Android/Kotlin/Java profiler and layout inspector
languages: []
launchTypes:
- android-studio
fileExtensions:
- apk
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-mobile-launch
  - android-studio
initialize:
  adapterID: android-studio
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
