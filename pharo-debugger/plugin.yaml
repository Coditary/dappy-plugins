id: pharo-debugger
name: Pharo Debugger
version: 0.1.0
description: Smalltalk live object-oriented debugger
languages: []
launchTypes:
- pharo-debugger
fileExtensions:
- image
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - pharo-debugger
initialize:
  adapterID: pharo-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
