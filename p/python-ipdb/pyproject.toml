[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-ipdb"
version = "0.1.0"
description = "Dappy stdio bridge for ipdb via ipdab"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dappy-ipdb-bridge = "dappy_ipdb.bridge:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_ipdb*"]
