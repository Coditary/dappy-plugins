id: python-ipdb
name: Python (ipdb via ipdab)
version: 0.1.0
attachment: attachment.yaml
languages:
  - python
launchTypes:
  - python-ipdb
fileExtensions:
  - py
adapter:
  transport: stdio
  command: dappy-ipdb-bridge
  args: []

initialize:
  adapterID: ipdb

launch:
  request: launch
  defaults:
    type: ipdb
    request: launch
    host: 127.0.0.1
    port: 9000
  fields:
    program: "${program.abs}"
    cwd: "${program.parent}"
    python: "${env:PYTHON}"

init:
  steps:
    - request: launch
      useLaunchArguments: true
      waitForEvent: initialized
    - request: configurationDone
      arguments: {}
      recordEntry:
        path: "${program.abs}"
        line: 1
