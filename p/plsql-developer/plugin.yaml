id: plsql-developer
name: PL/SQL Developer
version: 0.1.0
description: Oracle PL/SQL stored procedure debugger
languages: []
launchTypes:
- plsql-developer
fileExtensions:
- sql
- pks
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-database-launch
  - plsql-developer
initialize:
  adapterID: plsql-developer
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
