id: processing-debugger
name: Processing Debugger
version: 0.1.0
description: Processing IDE visual sketch debugger
languages: []
launchTypes:
- processing-debugger
fileExtensions:
- pde
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - processing-debugger
initialize:
  adapterID: processing-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
