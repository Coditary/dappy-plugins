# Connect-only manifest: attach to an already listening madbg server (set_trace /
# madbg connect) without injecting into a PID. Install as dap/plugins/madbg-connect.yaml.
id: madbg-connect
name: madbg connect
version: 0.1.0
description: Connect to an existing madbg TCP server (default 127.0.0.1:3513)
languages:
  - python
launchTypes:
  - python-madbg
  - madbg-connect
fileExtensions:
  - py
adapter:
  transport: stdio
  command: python3
  args:
    - -m
    - madbg_dap
initialize:
  adapterID: python-madbg
launch:
  request: attach
  defaults:
    type: python-madbg
    request: attach
    host: "127.0.0.1"
    port: 3513
    connectOnly: true
  fields:
    program: "${program.abs}"
init:
  steps:
    - request: attach
      useLaunchArguments: true
      waitForEvent: initialized
    - request: configurationDone
      arguments: {}
