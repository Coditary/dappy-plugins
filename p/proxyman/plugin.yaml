id: proxyman
name: Proxyman
version: 0.1.0
description: Modern HTTP debugging proxy
languages: []
launchTypes:
- proxyman
fileExtensions:
- json
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-mobile-launch
  - proxyman
initialize:
  adapterID: proxyman
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
