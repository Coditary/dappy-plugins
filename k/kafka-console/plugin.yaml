id: kafka-console
name: Kafka Console
version: 0.1.0
description: Kafka producer/consumer and offset debugging
languages: []
launchTypes:
- kafka-console
fileExtensions:
- json
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-data-protocol-launch
  - kafka-console
initialize:
  adapterID: kafka-console
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
