id: kadb-ddb
name: KADB / DDB
version: 0.1.0
description: In-kernel debugger for BSD and UNIX
languages: []
launchTypes:
- kadb-ddb
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-historic-launch
  - kadb-ddb
initialize:
  adapterID: kadb-ddb
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
