id: lua-mobdebug
name: LuaDB / MobDebug
version: 0.1.0
description: Lua remote debugger (MobDebug protocol)
languages: []
launchTypes:
- lua-mobdebug
fileExtensions:
- lua
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-launch
  - lua-mobdebug
initialize:
  adapterID: lua-mobdebug
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
