id: bash-trace
name: bash trace
version: 0.1.0
description: Shell script execution tracing (bash -xv)
languages: []
launchTypes:
- bash-trace
fileExtensions:
- sh
- bash
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-extra-launch
  - bash-trace
initialize:
  adapterID: bash-trace
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
