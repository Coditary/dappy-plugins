id: wireshark-lua
name: Wireshark Lua Dissector
version: 0.1.0
description: Custom Wireshark protocol dissector scripts
languages: []
launchTypes:
- wireshark-lua
fileExtensions:
- lua
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-network-launch
  - wireshark-lua
initialize:
  adapterID: wireshark-lua
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
