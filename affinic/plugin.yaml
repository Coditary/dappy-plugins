id: affinic
name: Affinic Debugger
version: 0.1.0
description: Graphical GDB front-end for Linux
languages: []
launchTypes:
- affinic
fileExtensions:
- elf
- exe
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-historic-launch
  - affinic
initialize:
  adapterID: affinic
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
