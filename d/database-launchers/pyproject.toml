[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-database-launch"
version = "0.1.0"
description = "Database and SQL debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-database-launch = "dappy_database_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_database_launch*"]
