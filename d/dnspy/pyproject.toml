[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-dnspy"
version = "0.1.0"
description = "dnSpy launcher for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-dnspy-launch = "dappy_dnspy.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_dnspy*"]
