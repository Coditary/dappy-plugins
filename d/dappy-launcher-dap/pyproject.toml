[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-launcher-dap"
version = "0.1.0"
description = "DAP bridge that launches external debuggers and tools for Dappy plugin manifests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-launcher-dap = "dappy_launcher_dap.adapter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_launcher_dap*"]
