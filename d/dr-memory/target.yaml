id: dr-memory
name: Dr. Memory
version: 0.1.0
description: Google memory error detector
targetTypes:
  - dr-memory
  - analysis
  - sanitizer

spawn:
  command: dappy-sanitizer-run
  args:
    - dr-memory
    - "${program.abs}"

connect:
  host: 127.0.0.1
  port: 0

attach:
  program: "${program.abs}"

