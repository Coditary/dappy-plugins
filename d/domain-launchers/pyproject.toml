[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-domain-launch"
version = "0.1.0"
description = "Domain-specific visual debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-domain-launch = "dappy_domain_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_domain_launch*"]
