id: dos-debug
name: DEBUG.COM
version: 0.1.0
description: Built-in MS-DOS hex/assembler debugger
languages: []
launchTypes:
- dos-debug
fileExtensions:
- com
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-historic-launch
  - dos-debug
initialize:
  adapterID: dos-debug
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
