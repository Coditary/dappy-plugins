id: dynatrace
name: Dynatrace
version: 0.1.0
description: AI-powered APM and live debugging platform
languages: []
launchTypes:
- dynatrace
fileExtensions:
- json
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-observability-launch
  - dynatrace
initialize:
  adapterID: dynatrace
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
