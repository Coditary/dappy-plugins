[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-firefox-dap"
version = "0.1.0"
description = "Firefox remote debugging launcher for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-firefox-dap = "dappy_firefox_dap.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_firefox_dap*"]
