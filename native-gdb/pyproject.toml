[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-gdb-dap"
version = "0.1.0"
description = "Minimal DAP bridge for GNU GDB (MI3) used by Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-gdb-dap = "dappy_gdb_dap.adapter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_gdb_dap*"]
