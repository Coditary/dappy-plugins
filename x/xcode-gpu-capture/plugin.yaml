id: xcode-gpu-capture
name: Xcode GPU Frame Capture
version: 0.1.0
description: Apple Metal GPU frame debugger
languages: []
launchTypes:
- xcode-gpu-capture
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-graphics-launch
  - xcode-gpu-capture
initialize:
  adapterID: xcode-gpu-capture
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
