id: xcode-instruments
name: Xcode Instruments
version: 0.1.0
description: iOS/iPadOS/macOS Instruments + LLDB
languages: []
launchTypes:
- xcode-instruments
fileExtensions:
- app
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-mobile-launch
  - xcode-instruments
initialize:
  adapterID: xcode-instruments
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
