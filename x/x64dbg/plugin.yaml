id: x64dbg
name: x64dbg / x32dbg
version: 0.1.0
description: Open-source Windows user-mode debugger
languages: []
launchTypes:
- x64dbg
fileExtensions:
- exe
- dll
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-re-launch
  - x64dbg
initialize:
  adapterID: x64dbg
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
