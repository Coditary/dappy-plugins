id: l4re-genode-debugger
name: L4Re / Genode Debugger
version: 0.1.0
description: Microkernel diagnostics for Genode/L4Re
languages: []
launchTypes:
- l4re-genode-debugger
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-microkernel-launch
  - l4re-genode-debugger
initialize:
  adapterID: l4re-genode-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
