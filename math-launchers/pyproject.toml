[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-math-launch"
version = "0.1.0"
description = "Mathematical and numerical software debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-math-launch = "dappy_math_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_math_launch*"]
