id: dax-studio
name: DAX Studio
version: 0.1.0
description: DAX query debugger for Power BI and Excel data models
languages: []
launchTypes:
- dax-studio
fileExtensions:
- dax
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - dax-studio
initialize:
  adapterID: dax-studio
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
