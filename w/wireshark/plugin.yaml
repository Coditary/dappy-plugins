id: wireshark
name: Wireshark
version: 0.1.0
description: Standard packet analyzer for network-level debugging
languages: []
launchTypes:
- wireshark
fileExtensions:
- pcap
- pcapng
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-network-launch
  - wireshark
initialize:
  adapterID: wireshark
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
