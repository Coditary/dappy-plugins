[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-network-launch"
version = "0.1.0"
description = "Protocol, network, and API debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-network-launch = "dappy_network_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_network_launch*"]
