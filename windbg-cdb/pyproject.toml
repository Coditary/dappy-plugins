[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-windbg-dap"
version = "0.1.0"
description = "WinDbg/CDB launcher for Dappy (Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-windbg-dap = "dappy_windbg_dap.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_windbg_dap*"]
