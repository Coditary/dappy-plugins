id: elastic-apm
name: Elastic APM
version: 0.1.0
description: Log and error analysis via Elasticsearch/Kibana
languages: []
launchTypes:
- elastic-apm
fileExtensions:
- json
- log
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-observability-launch
  - elastic-apm
initialize:
  adapterID: elastic-apm
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
