[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-embedded-launch"
version = "0.1.0"
description = "Embedded MCU/JTAG launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-embedded-launch = "dappy_embedded_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_embedded_launch*"]
