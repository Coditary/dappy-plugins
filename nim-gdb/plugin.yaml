id: nim-gdb
name: nim-gdb
version: 0.1.0
description: Nim to C/C++ debugging with GDB or LLDB
languages: []
launchTypes:
- nim-gdb
fileExtensions:
- nim
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - nim-gdb
initialize:
  adapterID: nim-gdb
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
