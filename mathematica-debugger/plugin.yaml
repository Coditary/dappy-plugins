id: mathematica-debugger
name: Mathematica Debugger
version: 0.1.0
description: Trace/Check symbolic computation debugger
languages: []
launchTypes:
- mathematica-debugger
fileExtensions:
- wl
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-math-launch
  - mathematica-debugger
initialize:
  adapterID: mathematica-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
