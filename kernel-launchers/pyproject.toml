[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-kernel-launch"
version = "0.1.0"
description = "Kernel, low-level, and hypervisor debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-kernel-launch = "dappy_kernel_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_kernel_launch*"]
