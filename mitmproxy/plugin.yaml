id: mitmproxy
name: mitmproxy
version: 0.1.0
description: SSL-capable MITM proxy for HTTP/HTTPS API debugging
languages: []
launchTypes:
- mitmproxy
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-network-launch
  - mitmproxy
initialize:
  adapterID: mitmproxy
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
