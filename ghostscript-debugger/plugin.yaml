id: ghostscript-debugger
name: Ghostscript Debugger
version: 0.1.0
description: Interactive PostScript debugger gs -Z
languages: []
launchTypes:
- ghostscript-debugger
fileExtensions:
- ps
- eps
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - ghostscript-debugger
initialize:
  adapterID: ghostscript-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
