[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-safari-dap"
version = "0.1.0"
description = "Safari Web Inspector launcher for Dappy (macOS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-safari-dap = "dappy_safari_dap.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_safari_dap*"]
