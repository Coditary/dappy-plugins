id: sigrok-pulseview
name: Sigrok / PulseView
version: 0.1.0
description: Open-source logic analyzer debugging
languages: []
launchTypes:
- sigrok-pulseview
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-hardware-launch
  - sigrok-pulseview
initialize:
  adapterID: sigrok-pulseview
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
