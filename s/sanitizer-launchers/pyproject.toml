[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-sanitizer-run"
version = "0.1.0"
description = "Sanitizer and memory-analysis runners for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-sanitizer-run = "dappy_sanitizer_run.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_sanitizer_run*"]
