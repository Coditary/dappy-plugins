id: any-run
name: Any.Run
version: 0.1.0
description: Interactive online malware analyzer
languages: []
launchTypes:
- any-run
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-instrumentation-launch
  - any-run
initialize:
  adapterID: any-run
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
