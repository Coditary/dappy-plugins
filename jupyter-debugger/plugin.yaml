id: jupyter-debugger
name: Jupyter debugger
version: 0.1.0
description: IPython kernel debugger for notebook cells
languages: []
launchTypes:
- jupyter-debugger
fileExtensions:
- ipynb
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-niche-language-launch
  - jupyter-debugger
initialize:
  adapterID: jupyter-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
