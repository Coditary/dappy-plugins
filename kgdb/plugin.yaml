id: kgdb
name: KGDB
version: 0.1.0
description: Linux kernel debugging via GDB on second machine
languages: []
launchTypes:
- kgdb
fileExtensions:
- elf
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-kernel-launch
  - kgdb
initialize:
  adapterID: kgdb
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
