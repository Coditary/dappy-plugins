[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-java-jdb"
version = "0.1.0"
description = "Java JDB/JDWP launcher for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-java-jdb = "dappy_java_jdb.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_java_jdb*"]
