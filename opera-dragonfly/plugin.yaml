id: opera-dragonfly
name: Opera Dragonfly (legacy)
version: 0.1.0
description: Historic Opera browser debugger (deprecated — use chrome-devtools / edge-devtools)
languages:
- javascript
launchTypes:
- dragonfly
fileExtensions:
- js
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-legacy-web-dap
  - dragonfly
initialize:
  adapterID: opera-dragonfly
launch:
  request: launch
  fields:
    program: ${program.abs}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
