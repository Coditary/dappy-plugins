[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-blockchain-launch"
version = "0.1.0"
description = "Smart contract and EVM debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-blockchain-launch = "dappy_blockchain_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_blockchain_launch*"]
