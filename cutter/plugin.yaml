id: cutter
name: Cutter
version: 0.1.0
description: GUI for Radare2
languages: []
launchTypes:
- cutter
fileExtensions:
- exe
- bin
- elf
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-re-launch
  - cutter
initialize:
  adapterID: cutter
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
