id: pix
name: PIX
version: 0.1.0
description: Microsoft DirectX 12 and Xbox graphics debugger
languages: []
launchTypes:
- pix
fileExtensions:
- exe
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-graphics-launch
  - pix
initialize:
  adapterID: pix
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
