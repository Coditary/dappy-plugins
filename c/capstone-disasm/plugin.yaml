id: capstone-disasm
name: Capstone / XED
version: 0.1.0
description: Disassembler frameworks (objdump helper)
languages: []
launchTypes:
- capstone-disasm
fileExtensions:
- exe
- bin
- elf
- o
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-re-launch
  - capstone-disasm
initialize:
  adapterID: capstone-disasm
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
