id: codeview
name: CodeView
version: 0.1.0
description: Microsoft historic DOS debugger
languages: []
launchTypes:
- codeview
fileExtensions:
- com
- exe
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-historic-launch
  - codeview
initialize:
  adapterID: codeview
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
