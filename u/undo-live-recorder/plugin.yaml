id: undo-live-recorder
name: Undo LiveRecorder
version: 0.1.0
description: Commercial time-travel debugger for Linux servers
languages: []
launchTypes:
- undo-live-recorder
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-timetravel-launch
  - undo-live-recorder
initialize:
  adapterID: undo-live-recorder
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
