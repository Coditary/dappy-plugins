id: unity-profiler
name: Unity Profiler
version: 0.1.0
description: Unity Engine profiler and debugger
languages: []
launchTypes:
- unity-profiler
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-graphics-launch
  - unity-profiler
initialize:
  adapterID: unity-profiler
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
