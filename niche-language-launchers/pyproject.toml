[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-niche-language-launch"
version = "0.1.0"
description = "Exotic and functional language debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-niche-language-launch = "dappy_niche_language_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_niche_language_launch*"]
