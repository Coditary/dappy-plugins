id: grpcurl-bloomrpc
name: grpcurl / BloomRPC
version: 0.1.0
description: gRPC service inspection and debugging
languages: []
launchTypes:
- grpcurl-bloomrpc
fileExtensions:
- json
- proto
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-data-protocol-launch
  - grpcurl-bloomrpc
initialize:
  adapterID: grpcurl-bloomrpc
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
