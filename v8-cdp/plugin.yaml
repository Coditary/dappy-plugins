id: v8-cdp
name: V8 CDP / Node inspect
version: 0.1.0
description: Chrome DevTools Protocol for Node.js/V8
languages: []
launchTypes:
- v8-cdp
fileExtensions:
- js
- mjs
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-bytecode-launch
  - v8-cdp
initialize:
  adapterID: v8-cdp
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
