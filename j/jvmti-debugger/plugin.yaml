id: jvmti-debugger
name: JVMTI Debugger
version: 0.1.0
description: Native JVM debug interface under Java IDEs
languages: []
launchTypes:
- jvmti-debugger
fileExtensions:
- java
- class
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-bytecode-launch
  - jvmti-debugger
initialize:
  adapterID: jvmti-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
