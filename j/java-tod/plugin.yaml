id: java-tod
name: Omniscient Debugger (TOD)
version: 0.1.0
description: Backward/forward Java debugger (TOD / Omniscient Debugger)
languages:
- java
launchTypes:
- java-tod
fileExtensions:
- java
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-java-tod
initialize:
  adapterID: java-tod
launch:
  request: launch
  fields:
    program: ${program.abs}
    todHome: ${env:TOD_HOME}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
