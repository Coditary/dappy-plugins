id: matlab-debugger
name: MATLAB Debugger
version: 0.1.0
description: Visual m-code debugger with breakpoints
languages: []
launchTypes:
- matlab-debugger
fileExtensions:
- m
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-math-launch
  - matlab-debugger
initialize:
  adapterID: matlab-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
