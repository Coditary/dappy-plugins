[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-ilspy"
version = "0.1.0"
description = "ILSpy launcher for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-ilspy-launch = "dappy_ilspy.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_ilspy*"]
