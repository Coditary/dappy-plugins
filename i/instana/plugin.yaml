id: instana
name: Instana
version: 0.1.0
description: Automated application observability (IBM)
languages: []
launchTypes:
- instana
fileExtensions:
- json
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-observability-launch
  - instana
initialize:
  adapterID: instana
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
