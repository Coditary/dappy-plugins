[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-instrumentation-launch"
version = "0.1.0"
description = "Dynamic instrumentation and malware analysis launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-instrumentation-launch = "dappy_instrumentation_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_instrumentation_launch*"]
