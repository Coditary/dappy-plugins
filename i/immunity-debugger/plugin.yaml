id: immunity-debugger
name: Immunity Debugger
version: 0.1.0
description: Exploit development debugger (OllyDbg-based)
languages: []
launchTypes:
- immunity-debugger
fileExtensions:
- exe
- dll
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-re-launch
  - immunity-debugger
initialize:
  adapterID: immunity-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
