id: instruments-profiler
name: Instruments Profiler
version: 0.1.0
description: Apple Time Profiler, Leaks, Core Animation
languages: []
launchTypes:
- instruments-profiler
fileExtensions:
- app
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-mobile-launch
  - instruments-profiler
initialize:
  adapterID: instruments-profiler
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
