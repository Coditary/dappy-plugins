id: amd-rgp
name: AMD RGP
version: 0.1.0
description: Radeon GPU Profiler and AMD developer tools
languages: []
launchTypes:
- amd-rgp
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-graphics-launch
  - amd-rgp
initialize:
  adapterID: amd-rgp
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
