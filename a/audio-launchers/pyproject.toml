[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-audio-launch"
version = "0.1.0"
description = "Audio and DSP debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-audio-launch = "dappy_audio_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_audio_launch*"]
