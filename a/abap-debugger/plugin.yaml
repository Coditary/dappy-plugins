id: abap-debugger
name: ABAP Debugger
version: 0.1.0
description: SAP GUI and ADT integrated ABAP debugger
languages: []
launchTypes:
- abap-debugger
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - abap-debugger
initialize:
  adapterID: abap-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
