id: ada-gnatdbg
name: Ada gnatdbg
version: 0.1.0
description: GNAT Ada debugger via gnatdbg/GDB backend
languages: []
launchTypes:
- ada-gnatdbg
fileExtensions:
- adb
- ada
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - ada-gnatdbg
initialize:
  adapterID: ada-gnatdbg
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
