id: ruby-rdbg
name: rdbg
version: 0.1.0
description: Ruby debug gem DAP-capable debugger
languages: []
launchTypes:
- ruby-rdbg
fileExtensions:
- rb
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-launch
  - ruby-rdbg
initialize:
  adapterID: ruby-rdbg
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
