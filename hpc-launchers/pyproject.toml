[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-hpc-launch"
version = "0.1.0"
description = "HPC and parallel MPI/OpenMP debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-hpc-launch = "dappy_hpc_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_hpc_launch*"]
