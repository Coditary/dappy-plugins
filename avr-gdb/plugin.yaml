id: avr-gdb
name: AVR-GDB
version: 0.1.0
description: GDB for AVR / Arduino microcontrollers
languages: []
launchTypes:
- avr-gdb
fileExtensions:
- elf
- hex
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-embedded-launch
  - avr-gdb
initialize:
  adapterID: avr-gdb
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
