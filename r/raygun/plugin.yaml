id: raygun
name: Raygun
version: 0.1.0
description: Crash reporting and Real User Monitoring
languages: []
launchTypes:
- raygun
fileExtensions:
- json
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-observability-launch
  - raygun
initialize:
  adapterID: raygun
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
