id: ruby-debug
name: Ruby debug
version: 0.1.0
description: Classic Ruby debug library debugger
languages: []
launchTypes:
- ruby-debug
fileExtensions:
- rb
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-launch
  - ruby-debug
initialize:
  adapterID: ruby-debug
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
