[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-re-launch"
version = "0.1.0"
description = "RE/disassembler launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-re-launch = "dappy_re_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_re_launch*"]
