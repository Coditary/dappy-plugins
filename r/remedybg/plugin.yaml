id: remedybg
name: RemedyBG
version: 0.1.0
description: Fast standalone Windows C/C++ debugger (RemedyBG)
languages:
- c
- cpp
launchTypes:
- remedybg
fileExtensions:
- exe
- c
- cpp
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-remedybg-launch
initialize:
  adapterID: remedybg
launch:
  request: launch
  defaults:
    type: remedybg
    request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
    remedybg: ${env:REMEDYBG}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
