id: ruby-pry
name: Pry
version: 0.1.0
description: Ruby Pry REPL debugger
languages: []
launchTypes:
- ruby-pry
fileExtensions:
- rb
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-launch
  - ruby-pry
initialize:
  adapterID: ruby-pry
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
