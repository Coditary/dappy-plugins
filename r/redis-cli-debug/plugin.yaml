id: redis-cli-debug
name: Redis CLI debug
version: 0.1.0
description: Redis MONITOR and DEBUG OBJECT inspection
languages: []
launchTypes:
- redis-cli-debug
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-data-protocol-launch
  - redis-cli-debug
initialize:
  adapterID: redis-cli-debug
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
