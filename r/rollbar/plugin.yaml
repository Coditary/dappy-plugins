id: rollbar
name: Rollbar
version: 0.1.0
description: Error monitoring and automated stack analysis
languages: []
launchTypes:
- rollbar
fileExtensions:
- log
- txt
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-observability-launch
  - rollbar
initialize:
  adapterID: rollbar
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
