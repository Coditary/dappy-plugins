[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-legacy-web-dap"
version = "0.1.0"
description = "Legacy web debugger stubs for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-legacy-web-dap = "dappy_legacy_web_dap.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_legacy_web_dap*"]
