id: factor-debugger
name: Factor Debugger
version: 0.1.0
description: Stack-based Factor listener debugger
languages: []
launchTypes:
- factor-debugger
fileExtensions:
- factor
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - factor-debugger
initialize:
  adapterID: factor-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
