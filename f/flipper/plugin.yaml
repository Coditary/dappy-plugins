id: flipper
name: Flipper
version: 0.1.0
description: Meta mobile debugging platform
languages: []
launchTypes:
- flipper
fileExtensions:
- json
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-mobile-launch
  - flipper
initialize:
  adapterID: flipper
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
