id: fpdebug
name: fpdebug
version: 0.1.0
description: Free Pascal and Lazarus integrated debugger
languages: []
launchTypes:
- fpdebug
fileExtensions:
- pas
- pp
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - fpdebug
initialize:
  adapterID: fpdebug
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
