id: cuckoo-sandbox
name: Cuckoo Sandbox
version: 0.1.0
description: Automated malware analysis and debugging
languages: []
launchTypes:
- cuckoo-sandbox
fileExtensions:
- bin
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-instrumentation-launch
  - cuckoo-sandbox
initialize:
  adapterID: cuckoo-sandbox
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
