id: common-lisp-slime
name: SLIME / Swank
version: 0.1.0
description: Common Lisp interactive Emacs/SLIME debugger
languages: []
launchTypes:
- common-lisp-slime
fileExtensions:
- lisp
- cl
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - common-lisp-slime
initialize:
  adapterID: common-lisp-slime
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
