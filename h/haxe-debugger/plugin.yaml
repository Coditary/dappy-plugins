id: haxe-debugger
name: Haxe Debugger
version: 0.1.0
description: Cross-platform Haxe debug via -debug and HashLink
languages: []
launchTypes:
- haxe-debugger
fileExtensions:
- hx
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - haxe-debugger
initialize:
  adapterID: haxe-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
