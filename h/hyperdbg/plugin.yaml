id: hyperdbg
name: HyperDbg
version: 0.1.0
description: Hypervisor-based stealth debugger for Windows
languages: []
launchTypes:
- hyperdbg
fileExtensions:
- exe
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-kernel-launch
  - hyperdbg
initialize:
  adapterID: hyperdbg
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
