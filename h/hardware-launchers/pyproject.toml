[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-hardware-launch"
version = "0.1.0"
description = "Firmware, FPGA, and emulator debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-hardware-launch = "dappy_hardware_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_hardware_launch*"]
