id: higan-bsnes
name: higan / bsnes
version: 0.1.0
description: SNES emulator with integrated debugger
languages: []
launchTypes:
- higan-bsnes
fileExtensions:
- sfc
- smc
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-hardware-launch
  - higan-bsnes
initialize:
  adapterID: higan-bsnes
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
