id: vivado-modelsim
name: Vivado / ModelSim
version: 0.1.0
description: VHDL/Verilog FPGA simulation debugger
languages: []
launchTypes:
- vivado-modelsim
fileExtensions:
- v
- vhdl
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-hardware-launch
  - vivado-modelsim
initialize:
  adapterID: vivado-modelsim
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
