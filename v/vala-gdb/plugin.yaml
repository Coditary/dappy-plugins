id: vala-gdb
name: Vala GDB
version: 0.1.0
description: Vala to C debugging via GDB
languages: []
launchTypes:
- vala-gdb
fileExtensions:
- vala
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - vala-gdb
initialize:
  adapterID: vala-gdb
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
