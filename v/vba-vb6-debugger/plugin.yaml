id: vba-vb6-debugger
name: VBA / VB6 Debugger
version: 0.1.0
description: Microsoft Office VBA and VB6 IDE debugger
languages: []
launchTypes:
- vba-vb6-debugger
fileExtensions:
- bas
- vba
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-language-platform-launch
  - vba-vb6-debugger
initialize:
  adapterID: vba-vb6-debugger
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
