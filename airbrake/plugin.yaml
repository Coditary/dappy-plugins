id: airbrake
name: Airbrake
version: 0.1.0
description: Cloud exception and error tracking
languages: []
launchTypes:
- airbrake
fileExtensions:
- json
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-observability-launch
  - airbrake
initialize:
  adapterID: airbrake
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
