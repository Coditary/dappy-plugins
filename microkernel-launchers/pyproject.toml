[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-microkernel-launch"
version = "0.1.0"
description = "RTOS and microkernel debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-microkernel-launch = "dappy_microkernel_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_microkernel_launch*"]
