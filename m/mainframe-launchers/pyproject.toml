[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dappy-mainframe-launch"
version = "0.1.0"
description = "Mainframe and enterprise debugger launchers for Dappy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dappy-mainframe-launch = "dappy_mainframe_launch.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dappy_mainframe_launch*"]
