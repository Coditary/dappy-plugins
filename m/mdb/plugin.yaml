id: mdb
name: MDB
version: 0.1.0
description: Modular Debugger for Solaris/illumos
languages: []
launchTypes:
- mdb
fileExtensions:
- dump
- core
adapter:
  transport: stdio
  command: python3
  args:
  - -m
  - dappy_launcher_dap
  - dappy-historic-launch
  - mdb
initialize:
  adapterID: mdb
launch:
  request: launch
  fields:
    program: ${program.abs}
    cwd: ${program.parent}
init:
  steps:
  - request: launch
    useLaunchArguments: true
    waitForEvent: initialized
  - request: configurationDone
    arguments: {}
