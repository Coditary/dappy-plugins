[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "madbg-dap"
version = "0.1.0"
description = "DAP bridge for the madbg remote Python debugger (Dappy plugin adapter)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
  "madbg>=1.3.2",
]

[project.scripts]
madbg-dap-adapter = "madbg_dap.bridge:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["madbg_dap*"]
